# Production stack: the app + managed-style Postgres on one VPS.
# Copy .env.production.example → .env and fill it in, then: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oqu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oqu}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oqu} -d ${POSTGRES_DB:-oqu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # Baked into the build: Next.js resolves metadataBase (OG/canonical
        # URLs) while prerendering, long before the runtime env exists.
        APP_URL: ${APP_URL:?set APP_URL in .env (e.g. https://oqu.kz)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bind the Next.js standalone server to all interfaces. Docker otherwise
      # sets HOSTNAME to the container id, so the server listens only on the
      # container IP and the loopback healthcheck (127.0.0.1) can't reach it.
      HOSTNAME: "0.0.0.0"
      # Audience is in Kazakhstan (UTC+5). Without this the container runs in
      # UTC and day boundaries (streaks, dates in /admin) shift by 5 hours.
      TZ: Asia/Almaty
      # App connects to the db service over the compose network.
      DATABASE_URL: postgres://${POSTGRES_USER:-oqu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oqu}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Required — password-reset links are built from this, never from the
      # request Host header (prevents reset-link poisoning).
      APP_URL: ${APP_URL:?set APP_URL in .env (e.g. https://oqu.kz)}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      # Migrations self-apply on boot; "false" opts out (see DEPLOY.md).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # First-owner bootstrap (created once, then ignored).
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME}
      # Optional integrations.
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MENTOR_MODEL: ${MENTOR_MODEL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # Contacts shown on the site and the inbox for new-lead notifications.
      # Blank → the defaults compiled into src/lib/contacts.ts.
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      OWNER_EMAIL: ${OWNER_EMAIL}
      # Seller details and refund terms behind /offer and /refund. Blank → those
      # pages 404 and stay out of the footer and sitemap, on purpose: an offer
      # with invented БИН/address is worse than a missing page.
      LEGAL_ENTITY_TYPE: ${LEGAL_ENTITY_TYPE}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME}
      LEGAL_ID: ${LEGAL_ID}
      LEGAL_ID_LABEL: ${LEGAL_ID_LABEL}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS}
      LEGAL_PHONE: ${LEGAL_PHONE}
      LEGAL_EMAIL: ${LEGAL_EMAIL}
      LEGAL_BANK_NAME: ${LEGAL_BANK_NAME}
      LEGAL_BANK_BIC: ${LEGAL_BANK_BIC}
      LEGAL_BANK_IBAN: ${LEGAL_BANK_IBAN}
      LEGAL_UPDATED: ${LEGAL_UPDATED}
      LEGAL_ACCESS_MONTHS: ${LEGAL_ACCESS_MONTHS}
      LEGAL_REFUND_DAYS: ${LEGAL_REFUND_DAYS}
      LEGAL_REFUND_PROGRESS_PERCENT: ${LEGAL_REFUND_PROGRESS_PERCENT}
      LEGAL_REFUND_PAYOUT_DAYS: ${LEGAL_REFUND_PAYOUT_DAYS}
      # Manual-payment details shown right after a purchase request. Blank →
      # the student sees the old «менеджер свяжется с вами» text instead.
      KASPI_NUMBER: ${KASPI_NUMBER}
      KASPI_LINK: ${KASPI_LINK}
      KASPI_RECIPIENT: ${KASPI_RECIPIENT}
      PAYMENT_NOTE: ${PAYMENT_NOTE}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB}
      # Free space the uploader refuses to eat into (MB). Postgres shares this
      # disk: filling it to the last byte takes the whole site down.
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB}
    volumes:
      # Uploaded videos persist across redeploys.
      - videos:/app/storage
    ports:
      # Loopback ONLY — the reverse proxy (Caddy, see DEPLOY.md) terminates
      # HTTPS on the same host. Publishing on 0.0.0.0 would leave the app
      # reachable at http://SERVER_IP:3000, sending passwords in plaintext and
      # letting anyone forge X-Forwarded-For to slip past the rate limiter.
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  db-data:
  videos:
